[package]
name = "effectcraft-helper-mos-dissolve"
version = "1.0.0"
edition = "2021"
license = "AGPL-3.0-or-later"
description = "EffectCraft external helper providing mos_消散 / mos_dissolve (text particle dissolve & pixel separation)"

[[bin]]
name = "effectcraft-helper-mos-dissolve"
path = "src/main.rs"

[dependencies]
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = "=1.0.154"
itoa = "=1.0.18"
memchr = "=2.8.3"
zmij = "=1.0.23"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
panic = "abort"
strip = true
